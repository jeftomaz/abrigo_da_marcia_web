name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Validate production variables
        run: |
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          node --input-type=module -e "
            const url = new URL(process.env.VITE_SUPABASE_URL)
            if (url.pathname !== '/' || url.search || url.hash || !url.hostname.endsWith('.supabase.co')) {
              console.error('SUPABASE_URL deve ser a URL-base https://<projeto>.supabase.co, sem /rest/v1.')
              process.exit(1)
            }
            if (!process.env.VITE_SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_')) {
              console.error('SUPABASE_PUBLISHABLE_KEY deve conter a publishable key.')
              process.exit(1)
            }
          "
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Build apps
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_ADMIN_BASE_PATH: ${{ steps.pages.outputs.base_path }}/admin/

      - name: Assemble Pages artifact
        run: |
          cp apps/public/dist/index.html apps/public/dist/404.html
          mkdir -p apps/public/dist/admin
          cp -R apps/admin/dist/. apps/public/dist/admin/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/public/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
