name: Verificação

# Branches e PRs recebem sinal rápido. O deploy chama este workflow após merge
# na main para executar a suíte completa antes da publicação.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sem Docker: roda em ~1 min e pega a maior parte das quebras nas branches.
  rapido:
    name: Lint e build
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Sem as variáveis VITE_*, o client cai nos padrões locais
      # (packages/shared/src/supabase/client.ts): valida tipos e bundle sem
      # precisar das credenciais de produção.
      - name: Build
        run: pnpm build

  completo:
    name: pgTAP e E2E
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - name: Subir Supabase local
        run: supabase start

      - name: Aplicar migrations e seed
        run: supabase db reset

      - name: pgTAP
        run: pnpm test:db

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium webkit

      - name: E2E
        run: pnpm e2e

      - name: Guardar rastros da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
