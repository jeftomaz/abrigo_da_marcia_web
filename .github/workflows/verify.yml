name: Verificação

# `workflow_call` deixa o deploy reusar estes mesmos jobs como pré-requisito,
# em vez de duplicar os passos: ver .github/workflows/deploy-pages.yml.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sem Docker: roda em ~1 min e pega a maior parte das quebras. Separado do
  # `completo` para dar sinal rápido antes da suíte longa terminar.
  rapido:
    name: Lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Sem as variáveis VITE_*, o client cai nos padrões locais
      # (packages/shared/src/supabase/client.ts): valida tipos e bundle sem
      # precisar das credenciais de produção.
      - name: Build
        run: pnpm build

  completo:
    name: pgTAP e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir Supabase local
        run: supabase start

      - name: Aplicar migrations e seed
        run: supabase db reset

      - name: pgTAP
        run: pnpm test:db

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium webkit

      # `supabase start` deixa o edge runtime em "Stopped services": sem este
      # passo, o teste de CORS das Edge Functions recebe 503 em vez de 403.
      # Sem ADMIN_ALLOWED_ORIGINS, `admin-http.ts` cai nas origens locais.
      - name: Servir Edge Functions
        run: |
          supabase functions serve --no-verify-jwt &
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
              http://127.0.0.1:54321/functions/v1/activate-event || true)
            case "$code" in 000|503) sleep 2 ;; *) echo "edge runtime pronto ($code)"; exit 0 ;; esac
          done
          echo 'edge runtime não respondeu' >&2
          exit 1

      - name: E2E
        run: pnpm e2e

      - name: Guardar rastros da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
